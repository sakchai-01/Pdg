{% extends "layout.html" %}

{% block title %}Admin Entry | Neural Command Access{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>

<div class="max-w-md mx-auto pt-24 pb-32 px-4 relative">
    <div class="text-center mb-12 animate__animated animate__fadeIn">
        <div data-i18n="admin_login_badge" class="inline-flex items-center gap-3 px-5 py-2 rounded-full border border-cyan-500/30 bg-cyan-50 text-cyan-700 text-[10px] font-black uppercase tracking-[0.3em] mb-6 shadow-sm">
            <i class="fa-solid fa-user-gear"></i> ADMIN_ACCESS_PROTOCOL
        </div>
        <h1 data-i18n="admin_login_title" class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight uppercase italic font-['Orbitron']">
            NEURAL <span class="text-gradient">CORE.</span>
        </h1>
    </div>

    <div class="cyber-card p-8 md:p-10 relative bg-white border-2 border-slate-300 shadow-xl rounded-3xl">
        <form id="adminLoginForm" class="space-y-6">
            <!-- Google Auth Step -->
            <div class="space-y-3">
                <label data-i18n="admin_step_1" class="text-[10px] font-bold text-slate-600 uppercase tracking-wider ml-1">STEP_01: IDENTITY_VERIFY</label>
                <div id="g_id_onload"
                    data-client_id="{{ google_client_id }}"
                    data-callback="handleAdminCredential"
                    data-auto_prompt="false"
                    data-itp_support="true"
                    data-use_fedcm_for_prompt="true"
                    data-prompt="select_account consent">
                </div>
                <div class="g_id_signin" data-type="standard" data-shape="pill" data-theme="outline" data-text="signin_with" data-size="large" data-width="100%"></div>
                <div id="idStatus" data-i18n="admin_waiting_token" class="text-xs text-center font-mono italic text-slate-500 mt-2">WAITING_FOR_TOKEN...</div>
            </div>

            <!-- Password Step -->
            <div class="space-y-3">
                <label data-i18n="admin_step_2" class="text-[10px] font-bold text-slate-600 uppercase tracking-wider ml-1">STEP_02: CRYPTO_KEY</label>
                <div class="relative">
                    <i class="fa-solid fa-key absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="password" name="password" 
                        class="w-full bg-slate-50 border border-slate-300 py-3.5 pl-11 pr-4 rounded-xl text-slate-900 outline-none focus:border-cyan-600 focus:bg-white transition font-mono text-sm shadow-inner" 
                        data-i18n-placeholder="admin_enter_secret" placeholder="ENTER_ADMIN_SECRET" required>
                </div>
            </div>

            <input type="hidden" id="google_token" name="google_token">

            <button type="submit" id="loginBtn" class="cyber-btn w-full py-4 text-sm font-black group">
                <span data-i18n="admin_login_btn" class="flex items-center justify-center gap-2">
                    <i class="fa-solid fa-shield-halved"></i>
                    INITIALIZE_LOGIN_SEQUENCE
                </span>
            </button>
        </form>
    </div>
</div>

<script>
    let googleToken = "";

    window.handleAdminCredential = function(response) {
        googleToken = response.credential;
        document.getElementById('google_token').value = googleToken;
        
        try {
            const email = JSON.parse(atob(googleToken.split('.')[1])).email;
            const statusEl = document.getElementById('idStatus');
            statusEl.textContent = "VERIFIED: " + email;
            statusEl.classList.remove('text-slate-500');
            statusEl.classList.add('text-emerald-600', 'font-bold');
            
            Swal.fire({
                icon: 'success',
                title: 'TOKEN_ACCEPTED',
                text: 'ยืนยันตัวตนสำเร็จ กรุณากรอกรหัสผ่านเพื่อเข้าสู่ระบบ',
                toast: true,
                position: 'top-end',
                showConfirmButton: false,
                timer: 2500,
                background: '#ffffff',
                color: '#0f172a'
            });
        } catch (e) {
            console.error("JWT parse error", e);
        }
    };

    document.getElementById('adminLoginForm').onsubmit = async (e) => {
        e.preventDefault();
        
        if (!googleToken) {
            return Swal.fire({
                icon: 'warning',
                title: 'IDENTITY_REQUIRED',
                text: 'กรุณายืนยันตัวตนด้วย Google ก่อนเข้าสู่ระบบ',
                background: '#ffffff',
                color: '#0f172a'
            });
        }

        const password = document.getElementById('password').value;
        
        try {
            const res = await fetch('/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ google_token: googleToken, password: password })
            });
            
            let data = {};
            try {
                data = await res.json();
            } catch (jsonErr) {
                data = { error: 'เซิร์ฟเวอร์ตอบกลับไม่ถูกต้อง (' + res.status + ')' };
            }
            
            if (res.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'ACCESS_GRANTED',
                    text: 'เข้าสู่ศูนย์ปฏิบัติการสำเร็จ...',
                    background: '#ffffff',
                    color: '#0f172a',
                    showConfirmButton: false,
                    timer: 1200
                }).then(() => {
                    window.location.replace('/admin/dashboard');
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'ACCESS_DENIED',
                    text: data.error || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง',
                    background: '#ffffff',
                    color: '#0f172a'
                });
            }
        } catch (err) {
            Swal.fire({
                icon: 'error',
                title: 'CONNECTION_FAILED',
                text: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ (โปรดตรวจสอบว่าเซิร์ฟเวอร์กำลังทำงานอยู่หรือไม่)',
                background: '#ffffff',
                color: '#0f172a'
            });
        }
    };
</script>
{% endblock %}
